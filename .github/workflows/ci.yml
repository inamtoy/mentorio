name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# RLS schemas every EduCore app owns tables in — kept in one place because
# both the role-bootstrap step and the post-migrate grant step need the
# exact same list. See backend/README.md "One-time Postgres role setup".
env:
  EDUCORE_SCHEMAS: >-
    foundation, auth, student, teacher, course, "group", attendance,
    finance, notification, schedule, homework, payment_gateways, billing,
    exams

jobs:
  frontend:
    name: Frontend (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` (not `npm install`) was tried first, since it's the usual
      # CI-correct choice — but it kept failing here with "Missing:
      # @emnapi/... from lock file" even right after regenerating
      # package-lock.json, because that regeneration can only ever be run
      # on Windows (this repo's only local dev machine), and Windows'
      # own npm never resolves — so never fully records — the nested
      # optional deps of @tailwindcss/oxide-wasm32-wasi, a Linux-only
      # dependency chain. No WSL/Docker is available locally to produce a
      # byte-correct Linux lockfile instead. `npm install` still installs
      # from the committed lockfile's pinned versions wherever they're
      # already consistent, and only repairs the platform-specific gaps
      # `npm ci` refuses to tolerate — an accepted, deliberate loosening
      # for this one known asymmetry, not a general policy of not trusting
      # the lockfile.
      - name: Install dependencies
        run: npm install

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Mirrors backend/README.md's "One-time Postgres role setup":
      # educore_app owns the test database and runs migrate directly (same
      # as real local dev). educore_auth_bypass is separately granted
      # *membership* in educore_app below (not just table/schema grants) —
      # Postgres role-membership privilege inheritance is live, not a
      # point-in-time snapshot, so educore_auth_bypass automatically gets
      # access to every schema/table educore_app creates *as it creates
      # them*, which is what several apps' 0004_seed_permissions migrations
      # need: they query via the auth_bypass_rls connection alias *during*
      # migrate, before a one-time post-migrate GRANT step would ever run.
      # (An earlier attempt ran migrate as the `postgres` superuser instead
      # — bypassing grants entirely — but that made this step hang
      # indefinitely in CI for reasons never root-caused; this role-
      # membership approach avoids superuser entirely and keeps migrate
      # running as the same educore_app role real dev uses.)
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-real
      DB_HOST: localhost
      DB_PORT: 5432
      # settings/test.py reads this into DATABASES["default"]["NAME"]; set
      # to the exact physical database name we provision below (skipping
      # Django's usual test-runner-managed "test_<NAME>" auto-creation,
      # since that path can't create the app-role grants it needs before
      # the test run — see the grant step below).
      TEST_DB_NAME: test_educore_test
      DB_USER: educore_app
      DB_PASSWORD: ci-app-password
      DB_AUTH_BYPASS_USER: educore_auth_bypass
      DB_AUTH_BYPASS_PASSWORD: ci-auth-bypass-password
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Create app roles + test database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE educore_app LOGIN PASSWORD 'ci-app-password' CREATEDB;
          CREATE ROLE educore_auth_bypass LOGIN PASSWORD 'ci-auth-bypass-password' BYPASSRLS;
          GRANT educore_app TO educore_auth_bypass;
          SQL
          PGPASSWORD=ci-app-password psql -h localhost -U educore_app -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE test_educore_test OWNER educore_app;'

      # Runs as educore_app, the database owner — same role real local dev
      # migrates as. This alone used to fail: several apps'
      # 0004_seed_permissions migrations query via the *separate*
      # auth_bypass_rls connection alias (role educore_auth_bypass)
      # mid-migrate, before a one-time post-migrate GRANT step would ever
      # run. Fixed above, not here: `GRANT educore_app TO
      # educore_auth_bypass` makes educore_auth_bypass inherit
      # educore_app's privileges live, as they're created — including on
      # schemas/tables this very migrate run is about to create — so no
      # mid-migrate permission gap exists. (BYPASSRLS itself is a role
      # attribute, not a privilege grant, so it's unaffected by this
      # membership — educore_auth_bypass still bypasses RLS as before.)
      # Wrapped in `timeout` — this step has hung indefinitely (not failed)
      # on every CI run so far, consistently at the exact same point:
      # foundation.0010_organization_subscription_plan_fk (the first
      # migration after billing's own — everything from foundation.0000
      # through billing.0004_seed_plans applies in ~2s total, then nothing
      # for 3+ minutes). That migration's RunPython is the first to call
      # foundation/migrations/0010's own _sync_auth_bypass_rls_to_default()
      # helper, which closes and re-points the auth_bypass_rls connection
      # before querying through it — the same helper attendance.0004 and
      # others use without incident earlier in the same run, so it's not
      # obviously that code path itself. GitHub's job-logs API only serves
      # a step's logs once it *finishes* (confirmed: an in-progress job's
      # /logs endpoint 404s), so a genuine hang here was previously
      # undebuggable at all; `timeout` turns it into a fast, loud failure
      # with the same partial "Applying x.0001... OK" progress output
      # manage.py migrate already prints per-migration, which is what
      # pinpointed the exact migration above. PGOPTIONS' statement_timeout
      # is a second, finer-grained diagnostic layered on top: if this is a
      # genuine Postgres-side lock wait (not a client-side network hang),
      # Postgres itself will cancel the stuck statement at 30s and report
      # *why* (e.g. "canceling statement due to statement timeout" with
      # the blocking query), instead of the outer `timeout` just killing
      # the process with no server-side context 150s later. Local repro (a
      # truly fresh DB, not --reuse-db) got through the full migration set,
      # this one included, in seconds with no hang anywhere once each
      # schema's grants were in place — so this is CI-environment-specific,
      # not the migration's own Python logic looping.
      - name: Migrate test database
        env:
          # Two different failure shapes, two different libpq env vars:
          # PGCONNECT_TIMEOUT bounds a stuck *connect()* (new physical
          # connection never establishing — plausible given the hang
          # starts exactly where a migration first opens a fresh
          # auth_bypass_rls connection after closing the old one);
          # PGOPTIONS' statement_timeout bounds a stuck *already-connected*
          # session (a genuine server-side lock wait). Whichever one fires
          # (or neither, if the outer `timeout 180` is what ultimately
          # kills it) narrows down which of the two this actually is.
          PGCONNECT_TIMEOUT: "20"
          PGOPTIONS: "-c statement_timeout=30000"
        run: timeout 180 uv run python manage.py migrate

      # educore_app already has everything as the table owner; this is only
      # for educore_auth_bypass's *own* login session during the actual
      # test run (the role-membership inheritance above covers privileges,
      # but explicit REFERENCES wasn't otherwise granted, and this doubles
      # as a defensive belt-and-suspenders check that inheritance alone
      # didn't quietly leave a gap).
      - name: Grant app roles access on test database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d test_educore_test -v ON_ERROR_STOP=1 <<SQL
          GRANT USAGE ON SCHEMA ${EDUCORE_SCHEMAS} TO educore_auth_bypass;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA ${EDUCORE_SCHEMAS} TO educore_auth_bypass;
          SQL

      - name: Run tests
        run: uv run pytest --reuse-db -q
