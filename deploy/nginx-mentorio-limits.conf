# Installed as /etc/nginx/conf.d/mentorio-limits.conf (http context, so the
# zones exist for both nginx-mentorio.conf and nginx-mentorio-http.conf).
# Flood protection for a 1-CPU server: without these, one machine running a
# loop could saturate gunicorn's workers or the Next.js renderer. Real DDoS
# (many machines) needs Cloudflare's proxy in front — see deploy/README.md.

# Don't advertise the nginx version in headers and error pages.
server_tokens off;

# ─── Real client address behind Cloudflare ───────────────────────────────────
# Harmless while Cloudflare is DNS-only: a request is only rewritten when it
# arrives FROM one of these ranges, so nobody else can spoof CF-Connecting-IP.
# Once the proxy is on, $remote_addr (rate limits, X-Real-IP -> Django's
# login lockout and audit logs) becomes the visitor instead of Cloudflare.
# Source: https://www.cloudflare.com/ips/ (fetched 2026-11-02).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ─── Rate limits (per client address) ────────────────────────────────────────
# Generous on purpose: Uzbek mobile carriers put many phones behind one
# carrier-grade NAT address, and a whole class may sign in at lesson start
# from one school network. Brute force itself is handled by the app's
# login lockout (auth_custom/views.py); these only stop floods.
#
# Login / password reset: 20 per minute, bursts of 20 allowed.
limit_req_zone $binary_remote_addr zone=mentorio_login:10m rate=20r/m;
# API: portal pages fan out several calls at once (rosters per group,
# all-pages fetches), hence the large burst.
limit_req_zone $binary_remote_addr zone=mentorio_api:10m rate=30r/s;
# Server-rendered pages (and Next's link prefetches): rendering is the most
# CPU-expensive thing this server does, including a 120 KB 404 page.
limit_req_zone $binary_remote_addr zone=mentorio_web:10m rate=10r/s;
# Concurrent requests per address (under HTTP/2, each stream counts).
limit_conn_zone $binary_remote_addr zone=mentorio_conn:10m;

limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;

# ─── Slow-client timeouts (slowloris) ────────────────────────────────────────
# Between two reads/writes, not for the whole request — a 10 MB homework
# upload on a slow phone is still fine.
client_header_timeout 10s;
client_body_timeout 30s;
send_timeout 30s;
reset_timedout_connection on;
# keepalive_timeout is set in the server block instead: Ubuntu's stock
# nginx.conf may already set it at http level, and a duplicate there fails
# `nginx -t`.
