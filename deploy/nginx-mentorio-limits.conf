# Installed as /etc/nginx/conf.d/mentorio-limits.conf (http context, so the
# zones exist for both nginx-mentorio.conf and nginx-mentorio-http.conf).
# Flood protection for a 1-CPU server: without these, one machine running a
# loop could saturate gunicorn's workers or the Next.js renderer. Real DDoS
# (many machines) needs Cloudflare's proxy in front — see deploy/README.md.

# server_tokens is NOT set here: Ubuntu's nginx.conf already sets it at http
# level (`server_tokens build;`), and a second http-level value fails
# `nginx -t`. nginx-mentorio.conf turns it off per server block instead.

# ─── Real client address behind Cloudflare ───────────────────────────────────
# Harmless while Cloudflare is DNS-only: a request is only rewritten when it
# arrives FROM one of these ranges, so nobody else can spoof CF-Connecting-IP.
# Once the proxy is on, $remote_addr (rate limits, X-Real-IP -> Django's
# login lockout and audit logs) becomes the visitor instead of Cloudflare.
# Source: https://www.cloudflare.com/ips/ (fetched 2026-11-02).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ─── Rate limits ─────────────────────────────────────────────────────────────
# One school Wi-Fi or one mobile carrier's NAT can put hundreds of students
# behind a single IP, so signed-in traffic is limited PER SESSION, not per
# address — one heavy user never slows their classmates down. Per-address
# limits exist only as wide backstops (sized for a whole school on one IP)
# and for anonymous traffic. Nothing here ever locks anyone out: excess
# requests get a 429 and succeed on retry a moment later.

# Session key: the refresh token's signature (the last 43 characters of the
# HS256 JWT in the httpOnly `refresh_token` cookie) — unique per signed-in
# device, short enough to keep the zones small. Empty when signed out, and
# nginx doesn't count requests whose key is empty.
map $cookie_refresh_token $mentorio_session {
    "~(?<sig>[A-Za-z0-9_-]{43})$" $sig;
    default "";
}
# Address key for signed-out requests only.
map $mentorio_session $mentorio_anon_ip {
    "" $binary_remote_addr;
    default "";
}

# Per signed-in session. Portal pages fan out several API calls at once
# (rosters per group, all-pages fetches) — hence the bursts.
limit_req_zone $mentorio_session zone=mentorio_api_session:10m rate=20r/s;
limit_req_zone $mentorio_session zone=mentorio_web_session:10m rate=5r/s;
# Signed-out visitors per address: the login page, branding, password
# reset. Burst sized for a class opening the login page together.
limit_req_zone $mentorio_anon_ip zone=mentorio_anon:10m rate=10r/s;
# Login / password-reset POSTs per address: a class of ~60 can sign in at
# once, then one attempt every 2 s. Password guessing itself is stopped by
# the app's per-account lockout (auth_custom/views.py), not here.
limit_req_zone $binary_remote_addr zone=mentorio_login:10m rate=30r/m;
# Backstop per address for everything dynamic: catches one machine sending
# random fake cookies to get a fresh session bucket each time. Wide enough
# for a few hundred active users behind one NAT.
limit_req_zone $binary_remote_addr zone=mentorio_ip:10m rate=150r/s;
# Concurrent requests per address (under HTTP/2 each stream counts) — also
# sized for a whole school behind one IP.
limit_conn_zone $binary_remote_addr zone=mentorio_conn:10m;

limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;

# ─── Slow-client timeouts (slowloris) ────────────────────────────────────────
# Between two reads/writes, not for the whole request — a 10 MB homework
# upload on a slow phone is still fine.
client_header_timeout 10s;
client_body_timeout 30s;
send_timeout 30s;
reset_timedout_connection on;
# keepalive_timeout is set in the server block instead: Ubuntu's stock
# nginx.conf may already set it at http level, and a duplicate there fails
# `nginx -t`.
