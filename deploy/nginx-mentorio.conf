# Mentorio behind HTTPS. One public origin: /api/ goes to Django, the rest
# to Next.js — same origin matters, the httpOnly auth cookies set by the
# API must reach proxy.ts. Certificate: certbot (setup_server.sh cert),
# renewed by certbot's systemd timer. Canonical host is mentorio.uz;
# www and plain http redirect to it. Rate-limit zones, timeouts and the
# Cloudflare real-IP list live in nginx-mentorio-limits.conf (conf.d).
upstream mentorio_api { server 127.0.0.1:8001; keepalive 16; }
upstream mentorio_web { server 127.0.0.1:3001; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name mentorio.uz www.mentorio.uz;
    server_tokens off;  # no nginx version in headers/error pages

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://mentorio.uz$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mentorio.uz;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/mentorio.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mentorio.uz/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    return 301 https://mentorio.uz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mentorio.uz;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/mentorio.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mentorio.uz/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Homework files are capped at 10 MB by the API (foundation/file_storage.py);
    # the extra room is the multipart envelope around such a file.
    client_max_body_size 12M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    include /etc/nginx/snippets/mentorio-security-headers.conf;

    limit_conn mentorio_conn 400;
    # Idle connections are cheap but not free on 1.6 GB of RAM.
    keepalive_timeout 30s;

    # Rate-limited requests get the API's own envelope, so the portals'
    # apiFetch() shows a readable message instead of a bare nginx page.
    error_page 429 = @too_many_requests;
    location @too_many_requests {
        default_type application/json;
        include /etc/nginx/snippets/mentorio-security-headers.conf;
        add_header Retry-After 60 always;
        return 429 '{"success":false,"message":"Too many requests from your network. Please wait a minute and try again.","data":null}';
    }

    # Unauthenticated, password-guessable or code-sending endpoints.
    # Nothing secret is served from disk (only .next/static is aliased), but
    # scanners probe for these constantly: answer 404 here, before the
    # request reaches Next.js or Django, so a misplaced file can never leak.
    location ~ /\.(?!well-known/) { return 404; }
    location ~* \.(env|bak|backup|old|orig|save|swp|sql|sqlite3?|dump|pem|key|log)$ { return 404; }

    location ~ ^/api/v1/auth/(login|password-reset)/ {
        limit_req zone=mentorio_login burst=60 nodelay;
        limit_req zone=mentorio_ip burst=1500 nodelay;
        proxy_pass http://mentorio_api;
        include /etc/nginx/snippets/mentorio-proxy.conf;
        include /etc/nginx/snippets/mentorio-security-headers.conf;
        add_header Cache-Control $mentorio_api_cache_control always;
    }
    location /api/ {
        limit_req zone=mentorio_api_session burst=80 nodelay;
        limit_req zone=mentorio_anon burst=200 nodelay;
        limit_req zone=mentorio_ip burst=1500 nodelay;
        proxy_pass http://mentorio_api;
        include /etc/nginx/snippets/mentorio-proxy.conf;
        include /etc/nginx/snippets/mentorio-security-headers.conf;
        add_header Cache-Control $mentorio_api_cache_control always;
    }
    # Static build assets: files on disk, cheap — not rate-limited. Every
    # name carries a content hash, so browsers and Cloudflare may keep them
    # forever. One Cache-Control header (`expires` would add a second).
    # ^~ so the dotfile/backup regexes above never shadow a build file.
    location ^~ /_next/static/ {
        alias /home/deploy/mentorio/frontend/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/mentorio-security-headers.conf;
        access_log off;
    }
    # public/ images (logo, favicon): not content-hashed, so a day rather
    # than forever — Next.js itself sends max-age=0, which made Cloudflare
    # revalidate them on every page view.
    location ~* ^/[^/]+\.(png|jpe?g|svg|ico|webp)$ {
        limit_req zone=mentorio_anon burst=200 nodelay;
        limit_req zone=mentorio_ip burst=1500 nodelay;
        proxy_pass http://mentorio_web;
        include /etc/nginx/snippets/mentorio-proxy.conf;
        proxy_hide_header Cache-Control;
        include /etc/nginx/snippets/mentorio-security-headers.conf;
        # No `always`: a 404 must not get the day-long lifetime, or
        # Cloudflare keeps serving it after the file is deployed (this hit
        # /favicon.ico). Errors leave without Cache-Control instead.
        add_header Cache-Control "public, max-age=86400";
    }
    location / {
        limit_req zone=mentorio_web_session burst=40 nodelay;
        limit_req zone=mentorio_anon burst=200 nodelay;
        limit_req zone=mentorio_ip burst=1500 nodelay;
        proxy_pass http://mentorio_web;
        include /etc/nginx/snippets/mentorio-proxy.conf;
    }
}
