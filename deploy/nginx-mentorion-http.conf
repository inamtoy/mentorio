# Bootstrap config: plain HTTP, used only until certbot has issued the
# certificate (setup_server.sh picks this or nginx-mentorion.conf). Keep
# the location blocks in sync with nginx-mentorion.conf.
upstream mentorion_api { server 127.0.0.1:8001; keepalive 16; }
upstream mentorion_web { server 127.0.0.1:3001; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name mentorio.uz www.mentorio.uz;

    client_max_body_size 10M;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /api/ {
        proxy_pass http://mentorion_api;
        include /etc/nginx/snippets/mentorion-proxy.conf;
    }
    location /_next/static/ {
        alias /home/deploy/mentorion/frontend/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location / {
        proxy_pass http://mentorion_web;
        include /etc/nginx/snippets/mentorion-proxy.conf;
    }
}
