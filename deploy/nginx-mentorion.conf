# Mentorio behind HTTPS. One public origin: /api/ goes to Django, the rest
# to Next.js — same origin matters, the httpOnly auth cookies set by the
# API must reach proxy.ts. Certificate: certbot (setup_server.sh cert),
# renewed by certbot's systemd timer. Canonical host is mentorio.uz;
# www and plain http redirect to it.
upstream mentorion_api { server 127.0.0.1:8001; keepalive 16; }
upstream mentorion_web { server 127.0.0.1:3001; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name mentorio.uz www.mentorio.uz;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://mentorio.uz$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mentorio.uz;

    ssl_certificate /etc/letsencrypt/live/mentorio.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mentorio.uz/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    return 301 https://mentorio.uz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mentorio.uz;

    ssl_certificate /etc/letsencrypt/live/mentorio.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mentorio.uz/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://mentorion_api;
        include /etc/nginx/snippets/mentorion-proxy.conf;
    }
    location /_next/static/ {
        alias /home/deploy/mentorion/frontend/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }
    location / {
        proxy_pass http://mentorion_web;
        include /etc/nginx/snippets/mentorion-proxy.conf;
    }
}
