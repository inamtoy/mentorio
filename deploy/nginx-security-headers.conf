# Installed as /etc/nginx/snippets/mentorio-security-headers.conf. Included
# at server level AND in every location that has its own add_header (nginx
# drops inherited add_headers in a location that defines any).

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Everything the frontend loads is same-origin (no CDNs, no web fonts, no
# third-party scripts). 'unsafe-inline' is needed for Next.js' inline
# hydration scripts and the theme's inline styles; the rest still blocks
# loading scripts from other sites, plugins, <base> hijacking, posting forms
# elsewhere and being framed. img-src allows https: because Super-Admin
# Settings lets the platform logo be an external URL. Payme/Click/Telegram
# are navigations (links/redirects), which CSP does not restrict.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
